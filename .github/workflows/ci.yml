name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. Nothing here writes to the repository, and when release.yml
# calls this workflow the called side can only lower the caller's permissions,
# so the CI gate never holds the release job's contents: write.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved);
      # the comment names the release the SHA was taken from. persist-credentials
      # false keeps the token out of .git/config, where the curl | sh installer
      # below could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The toolchain version is the cyrius.cyml [package].cyrius pin — the
        # single source of truth, never hardcoded here. Hand it to the upstream
        # install.sh, which lays out $HOME/.cyrius/{bin,lib,versions/<v>}. The
        # hand-rolled curl+cp-into-bin form is deliberately avoided: it skips
        # versions/<v>/ and so fails the `cyrius deps` pin-check.
        # Reference: patra / sigil.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        # Fetches the tyche git dependency (rng for t_randn) and vendors its
        # bundle to lib/tyche.cyr, alongside stdlib.
        run: cyrius deps

      - name: Format check
        run: |
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr tests/*.cyr; do
            cyrius fmt "$f" --check
          done

      - name: Lint
        # Hard gate: any warning fails, in src/ and tests/ (1.2.2). The old gate
        # linted src/ only and let "exceeds 120 characters" through.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr tests/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*(warn|error) '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Vet
        # cyaudit vet: every file the smoke entry includes resolves, and none is
        # untrusted. Exits 1 on a finding.
        run: cyrius vet src/main.cyr

      - name: Build smoke
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/rosnet
          echo "smoke: $(wc -c < build/rosnet) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/rosnet | grep -q "7f45 4c46"

      - name: Run smoke
        run: ./build/rosnet

      - name: Tests
        # `cyrius test tests` recursively runs tests/*.tcyr. tests/rosnet.tcyr is
        # the CPU correctness gate: exact BLAS-1 ops, CENTRAL finite-difference
        # grad-checks of linear_bwd / conv2d_bwd, and the optimized kernels
        # against the plain-loop oracles in tests/reference.cyr (bit-identical).
        # tests/gpu_host.tcyr checks the GPU profile's host side — shader-cache
        # bookkeeping, key fields, and every SPIR-V builder fitting its buffer —
        # which needs no device. cyrius 6.7.6 deprecated the plural
        # `cyrius tests` (it warns) and 6.7.12 removes it. tests/gpu_device.tcyr runs the
        # GPU ops on a real device; on a runner without one it checks the no-device
        # fallback contract instead (a file that calls assert_summary() must assert).
        run: cyrius test tests

      - name: Tests + fuzz on aarch64 (qemu-user)
        # docs/api.md's numerical contract differs by target: cyrius lowers the packed
        # multiply-add to a fused FMLA on aarch64, so linear's vector body rounds once
        # there, while the conv / BLAS-1 kernels must stay bit-identical to the plain
        # loops on BOTH targets. Those claims, and the suite's tolerance branches
        # (_packed_fma_exact() == 0), only run on aarch64. Fails rather than skips when
        # the cross-compiler or qemu is missing: a skipped gate would report green over
        # exactly what it exists to check. (Same shape as tyche's aarch64 leg.)
        run: |
          [ -x "$HOME/.cyrius/bin/cycc_aarch64" ] || {
            echo "::error::cycc_aarch64 not shipped with this Cyrius; cannot test the aarch64 half"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user || sudo apt-get install -y -qq qemu-user-static
          QEMU="$(command -v qemu-aarch64 || command -v qemu-aarch64-static)" || {
            echo "::error::no qemu-aarch64 binary after install"; exit 1; }
          mkdir -p build
          for t in rosnet gpu_host; do
            cyrius build --aarch64 "tests/$t.tcyr" "build/$t-a64"
            "$QEMU" "build/$t-a64"
          done
          CYRIUS_DCE=1 cyrius build --aarch64 tests/rosnet.fcyr build/rosnet-fuzz-a64
          timeout 300 "$QEMU" build/rosnet-fuzz-a64

      - name: Benchmarks
        run: CYRIUS_DCE=1 cyrius bench tests/rosnet.bcyr

      - name: Fuzz
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build tests/rosnet.fcyr build/rosnet-fuzz
          # deterministic property fuzzing (seeded); exit 1 = a property failed
          timeout 60 ./build/rosnet-fuzz || { echo "FUZZ: property failure, crash or timeout"; exit 1; }

      - name: distlib drift check
        # rosnet is a LIBRARY: consumers import dist/rosnet.cyr (the [lib]
        # bundle) and dist/rosnet-gpu.cyr (the [lib.gpu] profile), not src/.
        # Regenerate BOTH (--all = base + every [lib.X]; a bare `cyrius distlib`
        # rebuilds only the base, so before 1.2.2 a stale GPU bundle passed) and
        # fail if dist/ — bundles and .deps sidecars — differs from the commit.
        # distlib is byte-deterministic, so `git diff --exit-code` is a valid
        # sync gate. (The CPU bundle leaves tyche's rng_normal unresolved by
        # design — consumers supply it via their own [deps.tyche].)
        run: |
          cyrius distlib --all
          git diff --exit-code dist/ \
            || { echo "FAIL: dist/ is stale — run 'cyrius distlib --all' and commit."; exit 1; }

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for dangerous patterns
        # Informational. rosnet is pure arithmetic — no process/path/exec
        # surface — so these never fire today; kept for parity with sibling lib
        # repos and to catch a future regression.
        run: |
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve"
          fi
          if grep -rn '"/etc/' src/ 2>/dev/null; then
            echo "WARN: hardcoded /etc paths"
          fi
          echo "security scan complete"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required docs
        # Only files that exist in rosnet are gated — gating an absent file would
        # falsely red the build. dist/rosnet.cyr is required: it is the shipped
        # consumable bundle.
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml dist/rosnet.cyr; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the VERSION
          # file — VERSION is the single source of truth. Resolve the template to
          # the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "version not in changelog"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"
