name: Release

on:
  push:
    # X.Y.Z with an optional suffix (the cyrius init template's filter). A
    # stray tag that only starts with a digit no longer starts a release.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Read-only by default. Only the release job, which publishes, gets
# contents: write, so the CI gate it calls never holds a write token.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a full commit SHA, as in ci.yml. persist-credentials false:
      # git archive needs no token, and the curl | sh installer below runs in
      # this job, which holds contents: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the
          # VERSION file — VERSION is the single source of truth. Resolve
          # the template to the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        # Same upstream install.sh form as CI: version read from cyrius.cyml's
        # [package].cyrius pin (never hardcoded), piped through the official
        # installer so `cyrius deps` pin-check passes.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: cyrius deps

      - name: Build smoke (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/rosnet
          echo "rosnet smoke: $(wc -c < build/rosnet) bytes"

      - name: Regenerate bundles
        # `cyrius distlib --all` reads [lib].modules (tensor / linear / conv) and
        # [lib.gpu].modules (gpu) from cyrius.cyml and writes dist/rosnet.cyr and
        # dist/rosnet-gpu.cyr with the version header re-stamped from VERSION.
        # CI's distlib drift check already proved the committed bundles are in
        # sync; regenerating here guarantees the published artifacts ship
        # freshly-built bytes.
        run: cyrius distlib --all

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -f rosnet-*.tar.gz rosnet-*.cyr
          git archive --format=tar.gz --prefix="rosnet-${TAG}/" -o "rosnet-${TAG}-src.tar.gz" HEAD
          # Ship the distlib bundles as standalone, version-stamped assets —
          # consumers import these via [deps.rosnet] modules = ["dist/rosnet.cyr"]
          # (plus "dist/rosnet-gpu.cyr" and [deps.mabda] for the GPU profile).
          cp dist/rosnet.cyr "rosnet-${TAG}.cyr"
          cp dist/rosnet-gpu.cyr "rosnet-gpu-${TAG}.cyr"
          sha256sum rosnet-*.tar.gz rosnet-*.cyr build/rosnet > SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          [ -s /tmp/body.md ] || echo "No changelog entry for ${GITHUB_REF_NAME}." > /tmp/body.md

      # The one step that uses the write token, so a moved tag here could rewrite
      # what a release ships: pinned to a full commit SHA.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "rosnet ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            rosnet-*.tar.gz
            rosnet-*.cyr
            build/rosnet
            SHA256SUMS
